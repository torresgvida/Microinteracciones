<!DOCTYPE html>
<html lang="es">
 
<head>

    <title>Microinteracciones</title>
    <link rel="stylesheet" href="css/style_animaciones.css">
</head>

<body>

    <section class="cuerpo">
        <h1 class="header">TIPOS DE ANIMACIÓN</h1>
        <div class="background"></div>

        <!-- ROTAR -->
        <div class="ROTARSECTION">
            <img class="rotar" src="img/Rehilete.png">
            <img class="palito" src="img/Rehilete2.png">
        </div>

        <!-- ESCALAR Y MOVER-->
         <div class="yumyum">
            <div class="escalar">
                <img src="img/kirby.png" alt="Kirby">
            </div>
            <div class="mover">
                <img src="img/frsa.png" alt="Fresa">
            </div>
        </div>

        <!-- COLOR -->
        <div class="colorin">
            <img src="https://cdn.wikirby.com/a/a0/KCC_Ball_Kirby_Artwork.png">
        </div>

        <!-- SOL -->
        <div class="solesito">
            <img src="https://static.vecteezy.com/system/resources/previews/009/662/828/non_2x/sun-sun-ray-icon-transparent-free-png.png">
        </div>

        <section class="boton">
            <a href="index.html">VOLVER</a>
        </section>

        <!-- TEXTOS -->
        <section class="textos">
            <h2 class="txt1">COLOR</h2>
            <h2 class="txt2">ROTAR</h2>
            <h2 class="txt3">ESCALAR</h2>
            <h2 class="txt4">MOVER</h2>
            <h2 class="txt5">COMBINADOS</h2>
        </section>


    </section>
